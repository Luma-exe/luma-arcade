[package]
name = "webrtc-producer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "webrtc-producer"
path = "src/main.rs"

[dependencies]
gstreamer = "0.23"
gstreamer-webrtc = "0.23"
gstreamer-sdp = "0.23"
glib = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 1
