<!doctype html>
<html>
<head><meta charset="utf-8"><title>luma-arcade producer</title></head>
<body style="margin:0;background:#000;">
<script>
const { signallingUri, iceServers, sourceId, fallbackSourceId } = window.lumaProducer.config;
const report = window.lumaProducer.reportStatus;

let ws;
let pc;
let sessionId;
let localStream;

function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

function connectSignalling() {
  ws = new WebSocket(signallingUri);
  ws.onopen = () => {
    report("registered with signalling server");
    send({ type: "setPeerStatus", roles: ["producer"] });
  };
  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);
    switch (msg.type) {
      case "startSession": {
        sessionId = msg.sessionId;
        await createPeerConnection();
        break;
      }
      case "peer": {
        if (!pc) break;
        if (msg.sdp && msg.sdp.type === "answer") {
          await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp.sdp });
        } else if (msg.ice) {
          try {
            await pc.addIceCandidate({
              candidate: msg.ice.candidate,
              sdpMLineIndex: msg.ice.sdpMLineIndex,
            });
          } catch (err) {
            report("addIceCandidate failed: " + err.message);
          }
        }
        break;
      }
      case "endSession": {
        if (pc) {
          pc.close();
          pc = undefined;
        }
        break;
      }
      default:
        break;
    }
  };
  ws.onclose = () => setTimeout(connectSignalling, 2000);
  ws.onerror = () => ws.close();
}

async function createPeerConnection() {
  pc = new RTCPeerConnection({ iceServers });
  let videoSender;
  for (const track of localStream.getTracks()) {
    if (track.kind === "video") {
      // Without this, Chromium's WebRTC encoder was observed adaptively
      // decaying the actual send framerate for this desktop-capture track
      // down toward ~1fps within a few seconds -- content-aware bandwidth
      // adaptation treating the mostly-static desktop/app as "detail"
      // content not worth refreshing quickly, exactly the "screen just
      // froze" symptom. "motion" tells it to prioritize framerate instead.
      track.contentHint = "motion";
    }
    const sender = pc.addTrack(track, localStream);
    if (track.kind === "video") videoSender = sender;
  }

  if (videoSender) {
    // getStats() on this sender showed qualityLimitationReason="bandwidth",
    // capped at ~600kbps and downscaled to 256x192 from the real 1024x768 --
    // Chromium's congestion control (GCC) starts conservative and needs
    // sustained traffic to justify raising its own estimate, but low-motion
    // screen content never generates enough of it: a chicken-and-egg loop
    // that leaves it permanently capped low regardless of actually available
    // bandwidth (confirmed: raising it made no difference on a 500mbps
    // connection). Explicit encoding parameters bypass that estimator
    // entirely instead of hoping it eventually ramps up.
    const params = videoSender.getParameters();
    params.encodings = params.encodings && params.encodings.length ? params.encodings : [{}];
    params.encodings[0].maxBitrate = 8_000_000;
    params.encodings[0].minBitrate = 2_000_000;
    params.encodings[0].scaleResolutionDownBy = 1;
    // Raising min/maxBitrate alone still left the encoder trading framerate
    // away to preserve resolution/quality under any perceived constraint
    // (the default degradation preference) -- this is a desktop/game view,
    // where staying responsive matters far more than per-frame sharpness.
    params.degradationPreference = "maintain-framerate";
    videoSender.setParameters(params).catch((err) => report("setParameters failed: " + err.message));
  }

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      send({
        type: "peer",
        sessionId,
        ice: { candidate: e.candidate.candidate, sdpMLineIndex: e.candidate.sdpMLineIndex ?? 0 },
      });
    }
  };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  send({ type: "peer", sessionId, sdp: { type: "offer", sdp: offer.sdp } });

  // Direct visibility into *why* the encoder is capping output -- this is
  // the sender's own outbound-rtp stats, which carry qualityLimitationReason
  // ("cpu" | "bandwidth" | "other" | "none") and the actual frames encoded/
  // sent per second, none of which the consumer side can see.
  setInterval(async () => {
    if (!pc) return;
    const stats = await pc.getStats();
    stats.forEach((s) => {
      if (s.type === "outbound-rtp" && s.kind === "video") {
        report(
          `sender stats: fps=${s.framesPerSecond ?? "?"} limitReason=${s.qualityLimitationReason ?? "?"} ` +
            `encoded=${s.framesEncoded ?? "?"} sent=${s.framesSent ?? "?"} bitrateKbps=${
              s.targetBitrate ? Math.round(s.targetBitrate / 1000) : "?"
            } resolution=${s.frameWidth ?? "?"}x${s.frameHeight ?? "?"}`
        );
      }
    });
  }, 3000);
}

async function acquire(id) {
  return navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {
      mandatory: {
        chromeMediaSource: "desktop",
        chromeMediaSourceId: id,
        // Chromium's desktop capturer was observed decaying its actual
        // frame delivery rate from ~6fps down toward ~1fps within a few
        // seconds on a mostly-static screen (a CPU/bandwidth optimization
        // in the capture layer itself, separate from -- and not fixed by --
        // the WebRTC encoder's contentHint) -- an explicit minFrameRate
        // floor is the documented way to stop that at the capture source.
        minFrameRate: 15,
        maxFrameRate: 30,
      },
    },
  });
}

async function start() {
  try {
    localStream = await acquire(sourceId);
    report("capture acquired, sourceId=" + sourceId);
  } catch (err) {
    // Window capture of GPU-composited/DirectX-rendered windows (game and
    // emulator frontends, essentially always) can fail outright even with
    // the WGC capturer enabled -- falling back to full-screen capture at
    // least keeps the stream alive instead of leaving it dead.
    if (!fallbackSourceId) throw err;
    report("capture of " + sourceId + " failed (" + err.message + "), falling back to " + fallbackSourceId);
    localStream = await acquire(fallbackSourceId);
    report("fallback capture acquired, sourceId=" + fallbackSourceId);
  }
  connectSignalling();
}

start().catch((err) => {
  report("capture failed: " + err.message);
  console.error("getUserMedia failed", err);
});
</script>
</body>
</html>
