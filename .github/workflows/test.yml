# Runs the server's tests on every push and pull request. Windows, because
# the server is Windows-only (paths, PowerShell helpers, the service).
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p server/tsconfig.json --noEmit
      - run: npm test
